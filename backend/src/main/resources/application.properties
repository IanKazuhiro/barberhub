spring.application.name=barberhub-backend

spring.datasource.url=${BANCO_URL}
spring.datasource.username=${BANCO_USUARIO}
spring.datasource.password=${BANCO_SENHA}
barberhub.cors.origens=${CORS_ORIGENS:http://localhost:5173}


# Fuso da barbearia (RNF10): define o dia da agenda e os horarios oferecidos
barberhub.fuso=${BARBEARIA_FUSO:America/Manaus}

barberhub.jwt.segredo=${JWT_SEGREDO}
barberhub.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}
barberhub.admin.senha-inicial=${ADMIN_SENHA_INICIAL:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=${PORT:8080}